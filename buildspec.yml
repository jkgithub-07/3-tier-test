# new

version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    ECR_REPOSITORY: 3-tier-app/repo
    REPOSITORY_URI: 577638397823.dkr.ecr.us-east-1.amazonaws.com/3-tier-app/repo

phases:
  install:
    runtime-versions:
      php: 8.3
    commands:
      - echo "Installing Composer"
      - curl -sS https://getcomposer.org/installer -o composer-setup.php
      - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
      - rm composer-setup.php

  pre_build:
    commands:
      - echo "Installing AWS SDK dependencies"
      - composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - echo "Verifying dependencies"
      - test -f vendor/autoload.php

      - echo "Getting AWS account ID"
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

      - echo "Logging in to Amazon ECR"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-12)
      - echo "Image tag: $IMAGE_TAG"

  build:
    commands:
      - echo "Building Docker image"
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:12}
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .

      - echo "Pushing image to ECR"
      - docker push $REPOSITORY_URI:$IMAGE_TAG

      - echo "Docker build and ECR push completed"

artifacts:
  files:
    - appspec.yml
    - index.php
    - before_script.sh
    - after_script.sh
    - validate_script.sh
    - vendor/**/*
    - imageDetail.json
    - ecs-deployment/**/*
  discard-paths: no
